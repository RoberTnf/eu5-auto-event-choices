 aes_suspend_auto_event_choices.title: "Suspend Automatic Event Choices"
 aes_suspend_auto_event_choices.desc: "Events with a remembered option pop up normally again, so you can review them or click the cog to stop automating one. Your remembered choices are kept."
 aes_suspend_auto_event_choices.a: "Suspend"
 aes_resume_auto_event_choices.title: "Resume Automatic Event Choices"
 aes_resume_auto_event_choices.desc: "Remembered event options are chosen automatically again."
 aes_resume_auto_event_choices.a: "Resume"
